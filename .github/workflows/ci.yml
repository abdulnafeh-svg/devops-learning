name: DevOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-learning:test .

      - name: Run Docker container
        run: |
          docker run -d \
            --name devops-test \
            -p 5000:5000 \
            devops-learning:test

      - name: Test application
        run: |
          sleep 5
          curl --fail http://localhost:5000

      - name: Stop container
        if: always()
        run: docker rm -f devops-test
